[project]
name = "thesis-sudoku"
version = "0.1.0"
description = "Reproducible Sudoku dataset generation and certification for the thesis experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
thesis-sudoku = "sudoku.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sudoku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
