[project]
name = "thesis-sudoku"
version = "0.1.0"
description = "Reproducible Sudoku dataset generation and certification for the thesis experiments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
download = ["huggingface-hub>=0.34"]
local = [
  "accelerate>=1.10",
  "huggingface-hub>=0.34",
  "torch>=2.6",
  "transformers>=4.56",
  "vllm>=0.27.1; sys_platform == 'linux'"
]

[project.scripts]
thesis-sudoku = "sudoku.cli:main"
thesis-experiments = "experiments.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sudoku*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
