[project]
name = "thesis-sudoku"
version = "0.1.0"
description = "Reproducible Sudoku dataset generation and certification for the thesis experiments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
download = ["huggingface-hub>=0.34"]
local = [
  "accelerate>=1.10",
  "cuda-toolkit[nvcc]==13.0.3; sys_platform == 'linux'",
  "huggingface-hub>=0.34",
  "torch>=2.6",
  "transformers>=4.56",
  "vllm==0.28.0; sys_platform == 'linux'"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
